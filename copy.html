<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>One small step 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 80% at 50% 110%,#1b2233 0,#0a0d14 60%);color:#e8ebf2;font:500 17px/1.6 "Barlow",system-ui,sans-serif;text-align:center}
.card{max-width:440px;width:100%}
.moon{width:150px;height:86px;margin:0 auto 22px;border-radius:50%;background:#ffd23f;display:grid;place-items:center;box-shadow:0 0 60px 16px rgba(255,210,63,.45)}
.moon svg{width:62%;fill:#0a0d14}
h1{font:400 2rem/1.1 "Anton",sans-serif;letter-spacing:.02em;margin:0 0 10px}
p{color:#8b94a7;margin:0 0 20px}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #39435f;background:#0d111b;color:#e8ebf2;font:inherit;text-align:center;margin-bottom:14px}
button{width:100%;padding:15px;border:0;border-radius:8px;background:#ffd23f;color:#0a0d14;font:inherit;font-weight:600;font-size:1.05rem}
.done{min-height:1.6em;margin-top:12px;color:#4ade80;font-weight:600}
.msg{margin-top:18px;color:#ffd23f;font-weight:600;font-size:1.1rem}
</style>
</head>
<body>
<main class="card">
  <div class="moon"><svg viewBox="0 0 100 50"><path d="M50 10 L44 0 L42 10 C36 8 28 10 20 4 C22 14 14 24 0 26 C10 28 18 28 24 32 C28 30 34 30 38 34 C42 36 46 40 50 50 C54 40 58 36 62 34 C66 30 72 30 76 32 C82 28 90 28 100 26 C86 24 78 14 80 4 C72 10 64 8 58 10 L56 0 Z"/></svg></div>
  <h1>Your surprise is ready, Thangam ❤️</h1>
  <p>Copy the link below. It opens only on a laptop.</p>
  <input id="link" readonly aria-label="Surprise link">
  <button id="copy">Copy link</button>
  <div class="done" id="done" aria-live="polite"></div>
  <div class="msg">Paste the link in Chrome from laptop darling 💛</div>
</main>
<script>
/* put your real GitHub Pages link here */
const LINK = "https://kavya015-11.github.io/myBeee-surprise/";

const box = document.getElementById('link'), done = document.getElementById('done');
box.value = LINK;
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(LINK); }
  catch(e){ box.select(); box.setSelectionRange(0, 999); try { document.execCommand('copy'); } catch(e2){} }
  done.textContent = 'Copied ✔  Now paste it in Chrome on your laptop';
});
</script>
</body>
</html>
